# Local Vision Studio — every tunable lives here (Development Rule 7). Nothing below is hard-coded in code.
# Values marked "provisional" are starting points, not measured results.

app:
  host: 127.0.0.1          # local only by default (Development Rule 1)
  port: 8000
  allowed_hosts: [127.0.0.1, localhost]   # Host-header allowlist (DNS-rebinding guard)
  data_dir: data           # gitignored; per-project folders are created below it

  job_poll_interval_s: 0.2 # how often the WebSocket checks a running job

jobs:
  keep_finished: 50        # finished jobs remembered for progress display

projects:
  max_name_length: 80

tags:
  max_length: 40
  max_per_image: 20

images:                    # limits mirror common practice; provisional
  max_file_mb: 30
  max_side_px: 16384
  allowed_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp"]
  thumbnail_px: 256
  thumbnail_quality: 85         # JPEG quality of thumbnails
  thumbnail_draft_factor: 2     # JPEGs are decoded at >= this multiple of thumbnail_px (speed)

database:
  filename: studio.sqlite  # created inside app.data_dir

importing:                 # provisional limits
  max_zip_uncompressed_gb: 20   # refuse zips that would expand beyond this (zip-bomb guard)
  progress_every: 10            # report progress after this many files
  max_problems_recorded: 500    # per batch; counts stay exact, only the detail list is capped

gallery:
  default_page_size: 60
  max_page_size: 200

annotations:
  max_per_image: 2000
  max_points: 2000               # vertices per polygon / points per keypoint instance
  min_box_px: 1                  # smallest box side the server accepts
  min_polygon_area_px: 1         # polygons flatter than this are rejected
  coord_tolerance_px: 0.5        # allowed overshoot past the image edge (rounding in browsers)
  undo_limit: 500                # history steps kept in the browser
  save_debounce_ms: 400          # wait this long after an edit before saving
  filmstrip_size: 15             # thumbnails shown around the current image (odd number)
  # Colour-blind-safe (Okabe-Ito) plus four more; new classes take the first unused colour.
  palette: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7",
            "#999999", "#882255", "#44AA99", "#117733", "#AA4499"]

splits:
  default_ratios: {train: 0.8, val: 0.1, test: 0.1}
  default_seed: 42

hardware:
  device: auto             # auto | cuda | cpu — resolved at runtime, never assumed
  monitor_interval_s: 1.0  # provisional sampling period

training:
  seed: 42
  vram_headroom_fraction: 0.10   # keep this share of VRAM free when suggesting batch size; provisional
