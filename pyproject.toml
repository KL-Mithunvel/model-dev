[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU (skipped automatically when none is present)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools/rea", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generic template tool kept as-is; only line length is exempted.
"tools/compute_survey.py" = ["E501"]
# Dev tools hold many JavaScript one-liners inside strings; only line length is exempted.
"tools/*.py" = ["E501"]
"tools/scenarios/*.py" = ["E501"]
